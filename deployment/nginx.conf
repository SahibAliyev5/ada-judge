# Replace contest.example.edu and certificate paths before installing.
server {
    listen 80;
    server_name contest.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name contest.example.edu;
    ssl_certificate /etc/letsencrypt/live/contest.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contest.example.edu/privkey.pem;
    client_max_body_size 8m;

    location /static/ {
        alias /opt/contest/staticfiles/;
    }
    location /admin/ {
        # Replace with the university VPN subnet; retain deny all.
        allow 10.20.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
# Gunicorn sees Nginx as the remote address; Axes also limits by username.
# Apply a separate per-IP Nginx limit if exposing login beyond the campus VPN.
